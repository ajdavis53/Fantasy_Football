[project]
name = "fantasy-football"
version = "0.1.0"
description = "Snake draft optimizer for fantasy football"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "streamlit>=1.38",
    "requests>=2.32",
    "rapidfuzz>=3.9",
    "nfl-data-py>=0.3.2",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "data", "engine", "sim", "integrations", "ui", "scripts"]
