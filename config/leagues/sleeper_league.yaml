# The Sleeper league. Once integrations/sleeper_client.py exists (Phase 3),
# num_teams / roster_slots / scoring can be auto-pulled from Sleeper's league
# API instead of being maintained here.
#
# Same starting lineup as the live league plus a DEF slot, and one more bench
# spot. No kicker, so kickers are filtered off the board entirely.

name: "Sleeper League"
num_teams: 10
draft_slot: 1           # TODO: set once the draft order is known; overridable at runtime

roster_slots:
  - name: QB
    positions: [QB]
    count: 1
  - name: RB
    positions: [RB]
    count: 2
  - name: WR
    positions: [WR]
    count: 2
  - name: TE
    positions: [TE]
    count: 1
  - name: FLEX
    positions: [RB, WR, TE]
    count: 3
  - name: DEF
    positions: [DEF]
    count: 1
  - name: BENCH
    positions: [QB, RB, WR, TE, DEF]
    count: 8

# Full PPR, matching the ETR Full-PPR export used to build the board.
scoring:
  pass_yd: 0.04
  pass_td: 4
  pass_int: -2
  rush_yd: 0.1
  rush_td: 6
  rec: 1.0
  rec_yd: 0.1
  rec_td: 6
  fumble_lost: -2

# Ten teams means fewer rostered players than the 12-team live league, so
# replacement sits slightly shallower at RB/WR.
bench_offsets:
  QB: 2
  RB: 7
  WR: 7
  TE: 3
  DEF: 1

# See live_league.yaml for the format. Empty means a plain snake draft.
keepers: []

league_id: null   # TODO: Sleeper league_id
draft_id: null    # TODO: Sleeper draft_id (exists once the draft is created)
