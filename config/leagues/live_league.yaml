# Settings for the live, in-person league. No API exists for this league --
# fill these in by hand to match your actual league rules before Phase 1/2.
# TODO: replace every value below with your league's real settings.

name: "Live League (TODO: real name)"
num_teams: 12          # TODO: confirm team count
draft_slot: 1           # TODO: your draft position, 1-indexed

roster_slots:
  - name: QB
    positions: [QB]
    count: 1
  - name: RB
    positions: [RB]
    count: 2
  - name: WR
    positions: [WR]
    count: 2
  - name: TE
    positions: [TE]
    count: 1
  - name: FLEX
    positions: [RB, WR, TE]
    count: 1
  - name: K
    positions: [K]
    count: 1
  - name: DEF
    positions: [DEF]
    count: 1
  - name: BENCH
    positions: [QB, RB, WR, TE, K, DEF]
    count: 6

# Points per unit of each stat category. TODO: confirm against your league's
# actual scoring rules (this template assumes standard half-PPR).
scoring:
  pass_yd: 0.04
  pass_td: 4
  pass_int: -2
  rush_yd: 0.1
  rush_td: 6
  rec: 0.5
  rec_yd: 0.1
  rec_td: 6
  fumble_lost: -2

# Per-position VORP baseline offset beyond the last starter (tunable).
bench_offsets:
  QB: 3
  RB: 6
  WR: 6
  TE: 3
  K: 1
  DEF: 1

league_id: null
draft_id: null
