# The live, in-person league. No platform API exists for this one -- picks are
# entered by hand during the draft.
#
# Note there is no K and no DEF slot: kickers and defenses are undraftable
# here, and the board filters them out entirely (see engine/replacement.py's
# positions_with_demand).

name: "Live League"
num_teams: 12
draft_slot: 1           # TODO: set once the draft order is known; overridable at runtime

roster_slots:
  - name: QB
    positions: [QB]
    count: 1
  - name: RB
    positions: [RB]
    count: 2
  - name: WR
    positions: [WR]
    count: 2
  - name: TE
    positions: [TE]
    count: 1
  - name: FLEX
    positions: [RB, WR, TE]
    count: 3
  - name: BENCH
    positions: [QB, RB, WR, TE]
    count: 7

# Full PPR. Yardage-milestone bonuses vary in this league but are small and
# roughly position-neutral, so they are omitted rather than guessed at -- they
# would shift every player at a position by a similar amount and leave the
# value ordering essentially unchanged.
scoring:
  pass_yd: 0.04
  pass_td: 4
  pass_int: -2
  rush_yd: 0.1
  rush_td: 6
  rec: 1.0
  rec_yd: 0.1
  rec_td: 6
  fumble_lost: -2

# Replacement baseline depth beyond the last starter, per position. With three
# flex spots and seven bench slots, teams stash far more RB/WR than usual, so
# the freely-available replacement sits deeper than in a standard league.
bench_offsets:
  QB: 2
  RB: 8
  WR: 8
  TE: 3

# Keepers cost the team that round's pick, and teams keep different numbers,
# so the draft order ends up with per-team holes. Fill this in once keepers
# are declared; an empty list runs a plain snake draft.
#
#   keepers:
#     - team_slot: 3        # 1-indexed draft position of the team keeping him
#       player: "Bijan Robinson"
#       round: 2            # the round pick that team forfeits
keepers: []

league_id: null
draft_id: null
